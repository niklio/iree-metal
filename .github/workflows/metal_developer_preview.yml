name: Validate iree-metal preview packaging

on:
  workflow_dispatch:
    inputs:
      version:
        description: PEP 440 preview version (for example 3.11.0.dev20260802)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: metal-preview-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      IREE_METAL_VERSION: ${{ inputs.version }}
      IREE_METAL_PYTHON: python3
      IREE_METAL_WHEELHOUSE: ${{ github.workspace }}/wheelhouse
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          brew install ccache
          ccache --max-size "${CCACHE_MAXSIZE}"

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/Library/Caches/ccache
          key: iree-metal-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            iree-metal-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify clean recursive source
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          ! git submodule status --recursive | grep -E '^[+-U]'

      - name: Test packaged profile selection
        env:
          PYTHONPATH: integrations/pjrt/python_packages/iree_metal_plugin
        run: python3 -m unittest discover -s integrations/pjrt/python_packages/iree_metal_plugin/tests -v

      - name: Build wheels, dependency lock, provenance, and SBOM
        run: ./build_tools/iree_metal/build_preview_wheels.sh

      - name: Assemble offline bundle
        run: |
          python3 build_tools/iree_metal/package_preview_release.py \
            wheelhouse "${IREE_METAL_VERSION}"

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/Library/Caches/ccache
          key: iree-metal-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Upload candidate bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: iree-metal-preview-${{ inputs.version }}-macos-arm64
          path: wheelhouse
          if-no-files-found: error
          retention-days: 14
