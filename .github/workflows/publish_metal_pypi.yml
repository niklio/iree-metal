name: Publish iree-metal to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified developer-preview release tag
        required: true
        default: iree-metal-v3.11.0.dev2026080401
        type: string
  push:
    branches:
      - release/pypi-bootstrap

permissions:
  contents: read

concurrency:
  group: iree-metal-pypi
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Resolve verified release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${REQUESTED_TAG:-iree-metal-v3.11.0.dev2026080401}"
          version="${tag#iree-metal-v}"
          python3 -c 'import re, sys; raise SystemExit(not re.fullmatch(r"3\.11\.0\.dev[0-9]{8}(?:[0-9]{2})?", sys.argv[1]))' "${version}"
          release_state="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          test "${release_state}" = $'false\ttrue'
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download exact public release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir release-wheels
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'iree_base_compiler_iree_metal-*.whl' \
            --pattern 'iree_pjrt_plugin_metal_iree_metal-*.whl' \
            --pattern 'SHA256SUMS' \
            --dir release-wheels
          (cd release-wheels && sha256sum --check --ignore-missing SHA256SUMS)

      - name: Build and validate PyPI distributions
        env:
          IREE_METAL_PYTHON: python3
        run: |
          ./build_tools/iree_metal/build_pypi_metapackage.sh \
            "${{ steps.release.outputs.version }}" release-wheels pypi-dist
          python3 -m pip install --disable-pip-version-check twine
          python3 -m twine check pypi-dist/*.whl

      - name: Upload exact distributions for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iree-metal-pypi-${{ steps.release.outputs.version }}
          path: pypi-dist/*.whl
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: iree-metal-pypi-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist
          verbose: true
